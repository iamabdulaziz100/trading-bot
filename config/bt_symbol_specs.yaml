# Backtest symbol spec table (docs/spec/05_backtesting_spec.md §2). Editable from the UI.
# Account currency for backtests is USD.
#   pip_value_per_lot: USD per pip per 1.0 lot, or "auto" = derived from price when USD is the
#                      base or quote currency (EURUSD → 10.0; USDJPY → 1000 / price).
#                      Crosses (EURGBP …) need a number; update it to the current rate.
#   base_to_usd:       approximate USD value of 1 unit of the BASE currency, used only by the
#                      simplified margin model for crosses (XXXUSD / USDXXX are derived).
